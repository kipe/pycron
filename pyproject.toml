[project]
name = "pycron"
dynamic = ["version"]
description = "Simple cron-like parser, which determines if current datetime matches conditions."
authors = [{ name = "Kimmo Huoman", email = "kipenroskaposti+pycron@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["cron", "parser"]

[project.urls]
Homepage = "https://github.com/kipe/pycron"
Repository = "https://github.com/kipe/pycron"

[dependency-groups]
dev = [
  "arrow>=1.3.0,<2",
  "coverage>=7.6.1,<8",
  "delorean>=1.0.0,<2",
  "flake8>=7.1.1,<8",
  "pendulum>=3.0.0,<4",
  "pytz>=2024.2",
  "udatetime>=0.0.17,<0.1",
  "pylint>=3.3.1,<4",
  "mypy>=1.15.0,<2; platform_python_implementation != 'PyPy'",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
pattern = "default-unprefixed"
